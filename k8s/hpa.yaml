apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: repair-service-hpa
  namespace: repair-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: repair-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 40
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60
