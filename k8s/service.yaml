apiVersion: v1
kind: Service
metadata:
  name: repair-service
  namespace: repair-service
spec:
  selector:
    app: repair-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
      # nodePort fixo (convencao: 30080 monolito, 30081 core-service, 30082
      # repair-service, 30083 stock-service, 30084 billing-service, 30900
      # sonarqube)
      nodePort: 30082
  type: NodePort
